services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cabinet:
    build: ./cabinet
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cabinet-worker:
    build: ./cabinet
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]

  collector:
    build: ./collector
    env_file: .env
    environment:
      POSTGRES_HOST: db
      COLLECTOR_REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      collector-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8001"

  collector-migrate:
    build: ./collector
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  collector-worker:
    build: ./collector
    env_file: .env
    environment:
      POSTGRES_HOST: db
      COLLECTOR_REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      collector-migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
